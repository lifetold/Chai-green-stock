<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chai Green Stock set-up</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login" style="max-width:480px">
    <div class="logo">Chai Green</div>
    <div class="tag">Database set-up</div>
    <div class="card">
      <p>Press the button to copy the database set-up, then paste it into Supabase's SQL Editor and press Run.</p>
      <p></p>
      <button class="btn primary big" id="copy" disabled>Loading…</button>
      <p id="msg" class="muted" style="text-align:center"></p>
    </div>
  </div>
  <script>
    // The set-up SQL comes straight from the repository so it's always current.
    const btn = document.getElementById('copy');
    const msg = document.getElementById('msg');
    let sql = '';
    fetch('https://raw.githubusercontent.com/lifetold/chai-green-stock/main/supabase/schema.sql', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(t => { sql = t; btn.disabled = false; btn.textContent = 'Copy database set-up'; })
      .catch(() => { btn.textContent = 'Could not load — refresh the page'; });
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(sql);
      } catch (e) {
        // older browsers: copy from a hidden text box
        const ta = document.createElement('textarea');
        ta.value = sql; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      btn.textContent = '✅ Copied';
      msg.textContent = 'Now go back to Supabase and paste it.';
    };
  </script>
</body>
</html>
